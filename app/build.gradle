plugins {
    id 'com.android.application'
}


def cueClubServerUrl = providers.gradleProperty("cueClubServerUrl")
        .orElse("https://acumen-ruan2024.tail49ffe5.ts.net")
        .get()
if (!(cueClubServerUrl ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) {
    throw new GradleException("cueClubServerUrl must be an HTTPS origin without a path")
}

android {
    buildFeatures {
        buildConfig = true
    }
    namespace 'com.officepool'
    compileSdk 35

    defaultConfig {
        applicationId 'com.officepool'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'CUE_CLUB_SERVER_URL', '"' + cueClubServerUrl + '"'
    }
}
